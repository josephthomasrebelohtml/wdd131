<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form | Joseph Thomas Rebelo La Rocque da Silva</title>
    <meta name="description"
        content="Form for a Product Review of several products, including star ratings and liked features.">
    <meta name="author" content="Joseph Thomas Rebelo La Rocque da Silva">
    <link rel="stylesheet" href="styles/form-mobile.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="form">

                <div>
                <label for="products"><span class="p">Product Name (Required)</span>
                    <select name="product-name" id="products" required>
                        <option value="" disabled selected>Select a Product...</option>
                    </select>
                </label>
                </div>
                
                <div class="stars">
                <p class="p">Overall Rating (Required)</p>

                <label for="1" class="star"><input type="radio" name="rating" id="1" value="1" required>&star;</label>
                <label for="2" class="star"><input type="radio" name="rating" id="2" value="2" required>&star;&star;</label>
                <label for="3" class="star"><input type="radio" name="rating" id="3" value="3" required>&star;&star;&star;</label>
                <label for="4" class="star"><input type="radio" name="rating" id="4" value="4" required>&star;&star;&star;&star;</label>
                <label for="5" class="star"><input type="radio" name="rating" id="5" value="5" required>&star;&star;&star;&star;&star;</label>
                </div>
                <div>
                    <label for="installation"><span class="p">Date of installation (Required)</span><input type="date" name="installation" id="installation" required></label>
                </div>
                <div>
                <p>Which features did you find useful in the product? <br>(Check all that apply)</p>

                <label for="durability"><input type="checkbox" name="durability" value="durability" id="durability"> Durability</label>
                <label for="ease"><input type="checkbox" name="ease" value="ease" id="ease"> Ease of Use</label>
                <label for="performance"><input type="checkbox" name="performance" value="performance" id="performance"> Performance</label>
                <label for="design"><input type="checkbox" name="design" value="design" id="design"> Design</label>
                </div>

                <div>
                <label for="review"><span class="p">Written Review (Optional)</span></label>
                <textarea name="review" id="review" rows="4" cols="23"></textarea>
                </div>

                <div>
                <label for="name"><span class="p">Your Name (Optional)</span></label>
                <input type="text" name="name" id="name">
                </div>

                <div>
                <input type="submit" value="Post Review" id="submit-button">
                </div>

            

        </form>
    </main>

    <footer>
        <p>©️<span id="currentyear"></span>🐦‍⬛ Joseph Thomas Rebelo La Rocque da Silva 🐦‍⬛ Canada</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
